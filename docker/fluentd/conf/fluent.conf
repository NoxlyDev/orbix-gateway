# docker/fluentd/conf/fluent.conf

<source>
  @type kafka_group

  brokers kafka0:29092
  consumer_group fluentd
  topics orbix-payment-intent-events,orbix-payment-attempt-events,orbix-refund-events,orbix-dispute-events
  add_headers false
  add_prefix topic
  retry_emit_limit 2
</source>

<filter topic.orbix-payment-intent-events*>
  @type record_transformer
  renew_time_key created_at
</filter>

<filter topic.orbix-payment-attempt-events*>
  @type record_transformer
  renew_time_key created_at
</filter>

<filter topic.orbix-refund-events*>
  @type record_transformer
  renew_time_key created_at
</filter>


<filter topic.orbix-dispute-events*>
  @type record_transformer
  renew_time_key created_at
</filter>

<match topic.orbix-payment-intent-events*>
  @type copy

  <store>
    @type stdout
  </store>

  <store>
    @type opensearch
    host opensearch
    port 9200
    scheme https
    index_name orbix-payment-intent-events
    id_key payment_id
    user admin
    password '0penS3arc#'
    ssl_verify false
    prefer_oj_serializer true
    reload_on_failure true
    reload_connections false
    request_timeout 120s
    bulk_message_request_threshold 10MB
    include_timestamp true
  </store>

  <store>
    @type opensearch
    host opensearch
    port 9200
    scheme https
    index_name fluentd-orbix-payment-intent-events-%Y-%m-%d
    id_key payment_id
    user admin
    password '0penS3arc#'
    ssl_verify false
    prefer_oj_serializer true
    reload_on_failure true
    reload_connections false
    request_timeout 120s
    bulk_message_request_threshold 10MB
    include_timestamp true
    <buffer tag, time>
      timekey 10s
      timekey_wait 10s
    </buffer>
  </store>
</match>

